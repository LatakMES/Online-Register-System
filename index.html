<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#8ddfee">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<title>LMES</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#fff}
iframe{border:0;width:100%;height:100%;display:block}
#installBtn{position:fixed;right:16px;bottom:16px;z-index:9999;display:none;padding:12px 16px;border:0;border-radius:24px;background:#1a73e8;color:#fff;font-weight:600}
</style>
</head>
<body>
<iframe src="https://script.google.com/macros/s/AKfycbyRU1-MbWmv5wvVFJ9c89pxy_gkaigm7ejh5qm550kkeOqHKKQkk8yfusJItQPn2JVU/exec" allow="camera; microphone; geolocation"></iframe>
<button id="installBtn">Install LMES</button>
<script>
let deferredPrompt;
const btn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;btn.style.display='block';});
btn.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;btn.style.display='none';});
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
</script>
</body>
</html>
